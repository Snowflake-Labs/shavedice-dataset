    .demand-line {

      padding: 5px; /* Reduced padding */
      text-align: center;
      width: auto;     /* Let the box size to content */
      margin: 0 10px;  /* Add horizontal margin for spacing */
    }

    .summary-label {
      font-family: sans-serif;
      font-size: 14px; /* Same size as axis labels */

2024-01-20 22:00:00,56.6461020751542
2024-01-20 23:00:00,62.7313516545149`;

    // Parse the CSV string
    const data = d3.csvParse(csvData, (d) => {
      // Parse the date/time string.  Handle both formats.
      const parseDate = d3.timeParse("%Y-%m-%d %H:%M:%S");
      const parseDateShort = d3.timeParse("%Y-%m-%d");
      let parsedDate = parseDate(d.USAGE_HOUR);
      if (!parsedDate) {
        parsedDate = parseDateShort(d.USAGE_HOUR);
      }


      return {
        hour: parsedDate,  // Convert to Date object
        demand: +d.NORM_USAGE // Convert to number
      };
    });



    // --- 2. Setup SVG and Scales ---

    const margin = { top: 20, right: 30, bottom: 80, left: 70 }; // Increased bottom margin
    const width = 1160 - margin.left - margin.right;
    const height = 600 - margin.top - margin.bottom;

    const svg = d3.select("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
      .append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);


    // Use scaleTime for the x-axis
    const xScale = d3.scaleTime()
        .domain(d3.extent(data, d => d.hour)) // Use d3.extent to get min/max dates
        .range([0, width]);


    const yScale = d3.scaleLinear()
      .domain([0, d3.max(data, d => d.demand) * 2.1]) // Always scale to 2.1 * max demand
      .range([height, 0]);
//    const yScale = d3.scaleLinear()
//      .domain([0, d3.max(data, d => d.demand) * 1.1]) // Add some padding at the top
//      .range([height, 0]);

    // --- 3.  Axes ---

      // Format the x-axis to show dates
    const xAxis = d3.axisBottom(xScale)
        .tickFormat(d => {
            // Check if the time is 00:00:00
            if (d.getHours() === 0 && d.getMinutes() === 0 && d.getSeconds() === 0) {
                return d3.timeFormat("%A")(d); // %M/%d/%Y")(d); // Format as Month/Day/Year
            } else {
                return ""; // Return an empty string for other times, hiding the label
            }
        });


    const yAxis = d3.axisLeft(yScale);

    svg.append("g")
      .attr("class", "x axis") // Add class for styling
      .attr("transform", `translate(0,${height})`)
      .call(xAxis)
      .selectAll("text")  // Rotate the x-axis labels
        .style("text-anchor", "end")
        .attr("dx", "-.8em")
        .attr("dy", ".15em")
        .attr("transform", "rotate(-65)");

    svg.append("g")
      .attr("class", "y axis") // Add class for styling
      .call(yAxis);

    
      //X-Axis Label
      svg.append("text")
        .attr("transform", "translate(" + (width / 2) + " ," + (height + margin.top + 60) + ")") // Increased offset
        .style("text-anchor", "middle")
        .style("font-size", "16px") //Match new size
        .text("Hour");

      //Y-Axis Label
      svg.append("text")
        .attr("transform", "rotate(-90)")
        .attr("y", 0 - margin.left + 15)  //  offset from left margin
        .attr("x", 0 - (height / 2))
        .attr("dy", "1em") // removed, position already handles
        .style("text-anchor", "middle")
        .style("font-size", "16px") //Match new size
        .text("Demand");



    // --- 4. Threshold Line and Slider ---

    let threshold = 50; // Initial threshold value

    const thresholdLine = svg.append("line")
      .attr("class", "threshold-line")
      .attr("x1", 0)
      .attr("x2", width)
      .attr("y1", yScale(threshold))
      .attr("y2", yScale(threshold));

    const slider = d3.select("#threshold-slider");
    slider.on("input", function() {
      threshold = +this.value; // '+' converts string to number
      d3.select("#threshold-value").text(threshold);
      updateVisualization();
    });


    // --- 5.  Demand Line and Area ---

    const line = d3.line()
      .x(d => xScale(d.hour))
      .y(d => yScale(adjustDemand(d.demand, threshold))); // Use adjusted demand

      // --- 5.1. Helper Function to adjust demand according to the threshold ---

    function adjustDemand(demand, threshold) {
          if (demand > threshold) {
            return threshold + (demand - threshold) * 2.1;
          }
          return demand;
    }


    const demandLine = svg.append("path")
      .datum(data) // Bind *all* data to the line
      .attr("class", "demand-line")
      .attr("d", line);  //Use the line generator we set up earlier


       // --- 6. Area Fill Functions (Crucial for the Color Coding) ---

    const areaBelow = d3.area()
        .x(d => xScale(d.hour))
        .y0(height)
        .y1(d => yScale(Math.min(adjustDemand(d.demand, threshold), threshold)));

    const areaAboveThresholdBelowDemand = d3.area()
        .x(d => xScale(d.hour))
        .y0(d => yScale(threshold))
        .y1(d => yScale(Math.max(Math.min(adjustDemand(d.demand, threshold), d3.max(data, d => adjustDemand(d.demand, threshold))), threshold)));

    const areaBelowThresholdAboveDemand = d3.area()
      .x(d => xScale(d.hour))
      .y0(d => yScale(Math.min(d.demand, threshold)))
      .y1(d => yScale(threshold));


    // --- 7.  Update Function (for Slider Interaction) ---

    function updateVisualization() {
      // Update threshold line position
      thresholdLine.attr("y1", yScale(threshold))
                    .attr("y2", yScale(threshold));
      // Update areas
      svg.selectAll(".area-below").remove();
      svg.selectAll(".area-above-below").remove();
      svg.selectAll(".area-below-above").remove();

        svg.append("path")
          .datum(data)
          .attr("class", "area-below")
          .attr("fill", "green")
          .attr("d", areaBelow);

        svg.append("path")
          .datum(data)
          .attr("class", "area-above-below")
          .attr("fill", "yellow")
          .attr("d", areaAboveThresholdBelowDemand);

        svg.append("path")
          .datum(data)
          .attr("class", "area-below-above")
          .attr("fill", "red")
          .attr("d", areaBelowThresholdAboveDemand);

      // Update demand line (VERY important - re-draw the line)
      demandLine.attr("d", line); // Recalculate the line path
     //  yScale.domain([0, d3.max(data, d => adjustDemand(d.demand, threshold)) * 1.1]) //Update Y axis to match
       svg.select(".y.axis").call(yAxis);
    }

    // --- 7.  Update Function (for Slider Interaction) ---
    function updateVisualization() {
        // Update threshold line position
        thresholdLine.attr("y1", yScale(threshold))
                      .attr("y2", yScale(threshold));
        // Update areas
        svg.selectAll(".area-below").remove();
        svg.selectAll(".area-above-below").remove();
        svg.selectAll(".area-below-above").remove();

          svg.append("path")
            .datum(data)
            .attr("class", "area-below")
            .attr("fill", "green")
            .attr("d", areaBelow);

          svg.append("path")
            .datum(data)
            .attr("class", "area-above-below")
            .attr("fill", "yellow")
            .attr("d", areaAboveThresholdBelowDemand);

          svg.append("path")
            .datum(data)
            .attr("class", "area-below-above")
            .attr("fill", "red")
            .attr("d", areaBelowThresholdAboveDemand);

        // Update demand line (VERY important - re-draw the line)
        demandLine.attr("d", line); // Recalculate the line path
   
          // --- Update Summary Values ---
          d3.select("#commitment-level").text("$" + threshold.toLocaleString()); // Add $ and commas

          //Calculate Total Cost (sum of areas)
          let totalCost = 0;
          data.forEach(d => {
            let adjusted = adjustDemand(d.demand, threshold)
            //Below and Green
            totalCost += Math.min(adjusted, threshold);
            //Above and Yellow
            totalCost += Math.max(0, adjusted-threshold);  // Cost is 0 if below threshold
             // Below threshold, but above the demand curve
            totalCost += Math.max(0, threshold - d.demand);
          });

        d3.select("#total-cost").text("$" + totalCost.toFixed(2).toLocaleString()); // Add $ and commas
     }


     //Initial call for drawing areas
     updateVisualization();

    // --- 8. Legend ---

    const legendData = [
      { color: "yellow", label: "On Demand" },
      { color: "green", label: "Used Savings Plans" },
      { color: "red", label: "Unused Savings Plans" }
    ];

    const legend = d3.select("#legend");

    const legendItems = legend.selectAll(".legend-item")
      .data(legendData)
      .enter()
      .append("div")
      .attr("class", "legend-item");

    legendItems.append("span")
      .attr("class", "legend-color")
      .style("background-color", d => d.color);

    legendItems.append("span")
      .text(d => d.label);
  </script>
